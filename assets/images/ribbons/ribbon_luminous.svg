<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" fill="none">
  <defs>
    <linearGradient id="luminousGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7BB2DE" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#C5E1F6" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="70%" stop-color="#F8CAD8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E18BA7" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="luminousGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5591C5" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#E4E0FB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5A384" stop-opacity="0.7"/>
    </linearGradient>

    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="22" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#neonBlur)">
    <!-- Broad Ambient Aura -->
    <path d="M 50,220 C 250,60 450,380 700,200 C 850,90 920,180 960,260" stroke="url(#luminousGlowGrad)" stroke-width="45" stroke-linecap="round" fill="none" opacity="0.35"/>

    <!-- Sharp Glowing Ribbon Core -->
    <path d="M 50,220 C 250,60 450,380 700,200 C 850,90 920,180 960,260 L 950,285 C 910,210 840,120 700,230 C 460,405 240,100 60,245 Z" fill="url(#luminousGrad1)" opacity="0.85"/>

    <!-- Ultra-Bright Specular Beam -->
    <path d="M 55,232 C 245,80 455,390 700,215 C 845,105 915,195 955,272" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>
</svg>