<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" fill="none">
  <defs>
    <linearGradient id="loopGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8CAD8" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="70%" stop-color="#C5E1F6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7BB2DE" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="loopGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A384" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#E18BA7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C5E1F6" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="loopGlow" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#F8CAD8" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#7BB2DE" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#loopGlow)">
    <!-- Swirling Ribbon Loop -->
    <path d="M 80,380 C 120,200 280,70 450,110 C 600,145 660,280 580,380 C 510,470 380,480 270,430 L 290,385 C 380,425 480,420 540,350 C 600,270 550,165 435,140 C 295,110 160,220 125,370 Z" fill="url(#loopGrad1)"/>
    
    <!-- Internal Twist Accent -->
    <path d="M 450,110 C 520,125 570,165 590,220 L 545,245 C 530,205 495,175 440,160 Z" fill="url(#loopGrad2)"/>

    <!-- Crisp Light Highlight -->
    <path d="M 105,375 C 145,210 290,90 445,125 C 590,158 640,280 565,365" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>